# All secrets are read from environment variables (e.g. via a local, git-ignored .env file
# or your orchestrator's secret store) — never hardcode credentials in this file. See
# docker-compose.env.example for the required variable names.
#
# MySQL and Redis are NOT managed by this file — they live in the separate
# ~/partneriq/infrastructure project (partneriq-mysql / partneriq-redis on the
# partneriq-internal network). Start that project first:
#   cd ~/partneriq/infrastructure && docker compose up -d
# then start this one. DATABASE_PASSWORD / REDIS_PASSWORD below must be set to
# the exact same values as MYSQL_PASSWORD / REDIS_PASSWORD in
# infrastructure/.env — these are two separate .env files that both need to
# agree on the same credentials.

services:
  partneriq-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: partneriq-api
    user: "node"
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - APP_URL=${APP_URL:?APP_URL is required}
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_NAME=${DATABASE_NAME:?DATABASE_NAME is required}
      - DATABASE_USER=${DATABASE_USER:?DATABASE_USER is required}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - INTERNAL_OPS_KEY=${INTERNAL_OPS_KEY:?INTERNAL_OPS_KEY is required}
    networks:
      - partneriq-internal
    restart: unless-stopped

  # affiliate-backend: disabled — references a sibling project
  # (../affiliate-backend) that isn't cloned on this server, so
  # `docker compose build`/`up` fails outright with it enabled. Its database
  # engine/config also hasn't been verified. Clone ../affiliate-backend
  # alongside this repo, confirm its actual DB type, and uncomment this block
  # (fixing DATABASE_HOST/REDIS_HOST below if needed) when you're ready to
  # run it.
  #
  # affiliate-backend:
  #   build:
  #     context: ../affiliate-backend
  #     dockerfile: Dockerfile
  #   container_name: partneriq-affiliate-backend
  #   user: "node"
  #   ports:
  #     - "3006:3006"
  #   environment:
  #     - NODE_ENV=production
  #     - PORT=3006
  #     - APP_URL=http://localhost:3006
  #     - AFFILIATE_PORTAL_URL=http://localhost:3005
  #     - DATABASE_HOST=mysql
  #     - DATABASE_PORT=3306
  #     - DATABASE_NAME=${DATABASE_NAME:?DATABASE_NAME is required}
  #     - DATABASE_USER=${DATABASE_USER:?DATABASE_USER is required}
  #     - DATABASE_PASSWORD=${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
  #     - REDIS_HOST=redis
  #     - REDIS_PORT=6379
  #     - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  #     - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
  #     - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  #     - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
  #   networks:
  #     - partneriq-internal
  #   restart: unless-stopped

  partneriq-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: partneriq-worker
    user: "node"
    command: ["node", "dist/server.js", "--worker"]
    environment:
      - NODE_ENV=production
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_NAME=${DATABASE_NAME:?DATABASE_NAME is required}
      - DATABASE_USER=${DATABASE_USER:?DATABASE_USER is required}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
    networks:
      - partneriq-internal
    restart: unless-stopped

networks:
  # Created by the infrastructure project, not this one. `external: true`
  # tells Compose to join the existing network rather than create it — it
  # must already exist (i.e. infrastructure's `docker compose up -d` must
  # have run first) or `docker compose up` here will fail.
  partneriq-internal:
    external: true
    name: partneriq-internal
