version: '3.8'

# All secrets are read from environment variables (e.g. via a local, git-ignored .env file
# or your orchestrator's secret store) — never hardcode credentials in this file. See
# docker-compose.env.example for the required variable names.

services:
  partneriq-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: partneriq-api
    user: "node"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=${POSTGRES_DB:?POSTGRES_DB is required}
      - DATABASE_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - INTERNAL_OPS_KEY=${INTERNAL_OPS_KEY:?INTERNAL_OPS_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  affiliate-backend:
    build:
      context: ../affiliate-backend
      dockerfile: Dockerfile
    container_name: partneriq-affiliate-backend
    user: "node"
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
      - PORT=3006
      - APP_URL=http://localhost:3006
      - AFFILIATE_PORTAL_URL=http://localhost:3005
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=${POSTGRES_DB:?POSTGRES_DB is required}
      - DATABASE_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  partneriq-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: partneriq-worker
    user: "node"
    command: ["node", "dist/server.cjs", "--worker"]
    environment:
      - NODE_ENV=production
      - DATABASE_HOST=postgres
      - DATABASE_NAME=${POSTGRES_DB:?POSTGRES_DB is required}
      - DATABASE_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: partneriq-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      # Bind to loopback only — the app containers reach Postgres over the internal Docker
      # network by service name, so this port never needs to be reachable from the LAN/internet.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: partneriq-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      # Bind to loopback only — see postgres note above. Redis has no auth by default, so an
      # internet/LAN-reachable port with no password (the previous config) lets any network
      # peer read cache data and manipulate queues.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
